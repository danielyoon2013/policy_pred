# Catalog of base models available to the pipeline. Each entry is a stable name
# the rest of the codebase references; weights live at weights_dir on D:.
#
# To add a new base model: append an entry here, then run
#     python -m policy_pred.pipeline setup-model <name>
# and it will be ready for use as BASE_MODEL in policy_pred/config.py.

models:
  nanochat_1925:
    type: nanochat
    weights_dir: D:/hist_LLM/policy_pred/models/nanochat_1925
    notes: >-
      In-tree nanochat checkpoint trained on data through 1925. Populate via:
      'setup-model nanochat_1925 --from-path D:/hist_LLM/periods/1900_1925/model'.

  talkie_base:
    type: talkie
    weights_dir: D:/hist_LLM/policy_pred/models/talkie_base
    hf_id: talkie-lm/talkie-1930-13b-base
    notes: >-
      Talkie-LM 13B base (https://talkie-lm.com/introducing-talkie). Trained on
      text through 1930. Ships as a single ~53GB final.ckpt + vocab.txt -- NOT a
      standard transformers checkpoint, so TalkieBackend needs Talkie-LM's own
      model class to load it (cannot use AutoModelForCausalLM).
