# Train Talkie+LoRA on hist_LLM's factual_mc4 + factual_cot + b_cot_cot mix,
# eval on ARC-Challenge. After base ARC eval (arc_base.yaml) gives us a
# baseline, this YAML drives the retrain experiment.
#
# Usage on remote A100 (after scp-ing the combined data file):
#   1. Locally: cat gen_a_factual_mc4.jsonl gen_a_factual_cot.jsonl gen_b_cot_cot.jsonl \
#               > arc_train_mix.jsonl
#   2. scp arc_train_mix.jsonl + arc_challenge_test.jsonl to remote
#   3. accelerate launch --num_processes=4 --mixed_precision=no \
#          train.py --experiment experiments/arc_lora_histllm.yaml \
#          --data ~/data/arc_train_mix.jsonl --batch-size 2
#   4. python eval.py --experiment experiments/arc_lora_histllm.yaml
name: arc_lora_histllm

train:
  data: D:/hist_LLM/periods/1900_1949/posttraining_data/synthetic/by_generator/arc_train_mix.jsonl
  method: lora
  rank: 32
  lora_alpha: 64
  epochs: 1
  lr: 1.0e-4
  batch_size: 8
  seq_len: 2048

eval:
  evaluator: arc_mc
  test_set: D:/hist_LLM/eval_data/arc_challenge_test.jsonl
  n_samples: null
