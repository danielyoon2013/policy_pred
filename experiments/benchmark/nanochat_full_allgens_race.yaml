# Eval-only YAML: take the nanochat_full_allgens adapter and score it on
# RACE (Reading Comprehension). The runbook passes --adapter pointing at
# nanochat_full_allgens/checkpoint, so this YAML only needs the eval block.
#
# Output: experiments/benchmark_nanochat_full_allgens_race/eval.json
name: benchmark_nanochat_full_allgens_race
model_type: nanochat

eval:
  evaluator: race_mc
  test_set: data_links/eval/race_test.jsonl
  subset_filter: all          # "middle" | "high" | "all"
  n_samples: null
