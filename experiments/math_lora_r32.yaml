# Math methodology study — LoRA r=32 (default rank).
# Sample seed docs from technical/scientific collections, generate GSM8K-style
# word problems via OpenAI, train Talkie 1930 with LoRA, eval on GSM8K-test.
name: math_lora_r32

corpus:
  collections:
    - source: bulk_corpus
      filter:
        collection: ["Open-Science-Pile", "OpenAlex", "USPTO"]
        language: ["English"]
        min_word_count: 200
        max_word_count: 4000
  n_seeds: 5000
  seed: 42

synth:
  generators:
    math_word:
      n_per_seed: 3
      model: gpt-4o-mini
      temperature: 0.7
      max_tokens: 1024
      use_batch_api: false      # set true for production runs >5K seeds
      max_workers: 8
      max_doc_chars: 3000

train:
  method: lora
  rank: 32
  lora_alpha: 64
  epochs: 1
  lr: 1.0e-4
  batch_size: 8
  seq_len: 2048

eval:
  evaluator: gsm8k
  test_set: "gsm8k:main:test"
  n_samples: null               # null = all ~1319; set int for quick runs
  max_new_tokens: 256
